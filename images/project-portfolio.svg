<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Browser Mockup Window -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="55" width="450" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Window Bar -->
    <path d="M 70 65 Q 70 55 80 55 L 510 55 Q 520 55 520 65 L 520 90 L 70 90 Z" fill="#0f172a"/>
    <!-- Window Controls -->
    <circle cx="95" cy="73" r="5" fill="#ef4444"/>
    <circle cx="112" cy="73" r="5" fill="#f59e0b"/>
    <circle cx="129" cy="73" r="5" fill="#10b981"/>
    <!-- Address Bar -->
    <rect x="155" y="65" width="310" height="16" rx="4" fill="#1e293b"/>
    <text x="210" y="77" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">sujata830.github.io/portfolio</text>

    <!-- Browser Content (Portfolio Representation) -->
    <!-- Mini Navbar -->
    <rect x="90" y="105" width="410" height="24" rx="4" fill="#0f172a"/>
    <rect x="105" y="113" width="60" height="8" rx="2" fill="#38bdf8"/>
    <rect x="360" y="113" width="30" height="8" rx="2" fill="#94a3b8"/>
    <rect x="400" y="113" width="30" height="8" rx="2" fill="#94a3b8"/>
    <rect x="440" y="113" width="40" height="8" rx="2" fill="#3b82f6"/>

    <!-- Hero Card Mockup -->
    <rect x="90" y="140" width="410" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Hero Text -->
    <rect x="110" y="158" width="160" height="14" rx="3" fill="#f8fafc"/>
    <rect x="110" y="180" width="220" height="8" rx="2" fill="#38bdf8"/>
    <rect x="110" y="196" width="200" height="6" rx="2" fill="#64748b"/>
    <rect x="110" y="208" width="170" height="6" rx="2" fill="#64748b"/>
    <!-- Hero CTA Buttons -->
    <rect x="110" y="224" width="70" height="18" rx="4" fill="#2563eb"/>
    <rect x="190" y="224" width="70" height="18" rx="4" fill="#334155"/>
    <!-- Hero Avatar Graphic -->
    <circle cx="430" cy="195" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="430" cy="183" r="14" fill="#94a3b8"/>
    <path d="M 406 220 Q 430 205 454 220 Z" fill="#94a3b8"/>

    <!-- Grid Columns Mockup -->
    <rect x="90" y="262" width="128" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="102" y="275" width="70" height="8" rx="2" fill="#f8fafc"/>
    <rect x="102" y="290" width="100" height="5" rx="2" fill="#64748b"/>
    <rect x="102" y="300" width="85" height="5" rx="2" fill="#64748b"/>
    <rect x="102" y="318" width="35" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="145" y="318" width="35" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>

    <rect x="231" y="262" width="128" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="243" y="275" width="70" height="8" rx="2" fill="#f8fafc"/>
    <rect x="243" y="290" width="100" height="5" rx="2" fill="#64748b"/>
    <rect x="243" y="300" width="85" height="5" rx="2" fill="#64748b"/>
    <rect x="243" y="318" width="35" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="286" y="318" width="35" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>

    <rect x="372" y="262" width="128" height="115" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="384" y="275" width="70" height="8" rx="2" fill="#f8fafc"/>
    <rect x="384" y="290" width="100" height="5" rx="2" fill="#64748b"/>
    <rect x="384" y="300" width="85" height="5" rx="2" fill="#64748b"/>
    <rect x="384" y="318" width="35" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="427" y="318" width="35" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Mobile Screen Overlay Mockup (Demonstrating Responsive Design) -->
  <g filter="url(#cardShadow)">
    <rect x="545" y="110" width="185" height="285" rx="18" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <!-- Speaker & Camera -->
    <rect x="610" y="118" width="55" height="5" rx="2" fill="#334155"/>
    <circle cx="598" cy="120" r="2.5" fill="#334155"/>
    
    <!-- Mobile Screen Area -->
    <rect x="555" y="132" width="165" height="245" rx="4" fill="#1e293b"/>
    <!-- Mobile Header -->
    <rect x="565" y="142" width="70" height="8" rx="2" fill="#38bdf8"/>
    <rect x="690" y="142" width="18" height="2" fill="#94a3b8"/>
    <rect x="690" y="146" width="18" height="2" fill="#94a3b8"/>
    <rect x="690" y="150" width="18" height="2" fill="#94a3b8"/>

    <!-- Mobile Stacked Card -->
    <rect x="565" y="160" width="145" height="80" rx="4" fill="#0f172a"/>
    <circle cx="637" cy="182" r="16" fill="#334155"/>
    <rect x="585" y="206" width="105" height="6" rx="2" fill="#f8fafc"/>
    <rect x="595" y="218" width="85" height="5" rx="2" fill="#38bdf8"/>
    <rect x="600" y="228" width="75" height="8" rx="3" fill="#2563eb"/>

    <!-- Mobile Project Card Stack -->
    <rect x="565" y="250" width="145" height="55" rx="4" fill="#0f172a"/>
    <rect x="575" y="258" width="80" height="6" rx="2" fill="#f8fafc"/>
    <rect x="575" y="268" width="125" height="4" rx="1" fill="#64748b"/>
    <rect x="575" y="275" width="110" height="4" rx="1" fill="#64748b"/>
    <rect x="575" y="285" width="40" height="10" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>

    <rect x="565" y="315" width="145" height="50" rx="4" fill="#0f172a"/>
    <rect x="575" y="323" width="75" height="6" rx="2" fill="#f8fafc"/>
    <rect x="575" y="333" width="120" height="4" rx="1" fill="#64748b"/>
  </g>

  <!-- Semantic HTML Tag Badges -->
  <g>
    <rect x="70" y="22" width="110" height="22" rx="4" fill="#0284c7" opacity="0.9"/>
    <text x="78" y="37" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">&lt;semantic-html&gt;</text>

    <rect x="190" y="22" width="100" height="22" rx="4" fill="#2563eb" opacity="0.9"/>
    <text x="198" y="37" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">CSS3 Grid/Flex</text>

    <rect x="300" y="22" width="90" height="22" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="308" y="37" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Responsive</text>
  </g>
</svg>
