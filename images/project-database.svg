<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="dbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#dbBgGrad)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title Badge -->
  <g>
    <rect x="50" y="24" width="150" height="24" rx="4" fill="#0284c7" opacity="0.9"/>
    <text x="60" y="40" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">RDBMS SCHEMA / SQL</text>
    <rect x="210" y="24" width="120" height="24" rx="4" fill="#6366f1" opacity="0.9"/>
    <text x="220" y="40" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">RELATIONAL DATA</text>
  </g>

  <!-- Table 1: students -->
  <g filter="url(#dbShadow)">
    <rect x="50" y="70" width="220" height="175" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 50 78 Q 50 70 58 70 L 262 70 Q 270 70 270 78 L 270 102 L 50 102 Z" fill="#0369a1"/>
    <text x="65" y="92" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">tbl_students</text>

    <!-- Fields -->
    <text x="65" y="122" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">PK  student_id</text>
    <text x="180" y="122" fill="#94a3b8" font-family="monospace" font-size="10">INT(11)</text>
    <line x1="60" y1="130" x2="260" y2="130" stroke="#334155" stroke-width="1"/>

    <text x="65" y="148" fill="#f8fafc" font-family="monospace" font-size="11">    first_name</text>
    <text x="180" y="148" fill="#94a3b8" font-family="monospace" font-size="10">VARCHAR(50)</text>

    <text x="65" y="170" fill="#f8fafc" font-family="monospace" font-size="11">    last_name</text>
    <text x="180" y="170" fill="#94a3b8" font-family="monospace" font-size="10">VARCHAR(50)</text>

    <text x="65" y="192" fill="#f8fafc" font-family="monospace" font-size="11">    enroll_year</text>
    <text x="180" y="192" fill="#94a3b8" font-family="monospace" font-size="10">INT</text>

    <text x="65" y="214" fill="#f8fafc" font-family="monospace" font-size="11">    email</text>
    <text x="180" y="214" fill="#94a3b8" font-family="monospace" font-size="10">VARCHAR(100)</text>
  </g>

  <!-- Table 2: enrollments (Junction table) -->
  <g filter="url(#dbShadow)">
    <rect x="330" y="120" width="220" height="155" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M 330 128 Q 330 120 338 120 L 542 120 Q 550 120 550 128 L 550 152 L 330 152 Z" fill="#4338ca"/>
    <text x="345" y="142" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">tbl_enrollments</text>

    <!-- Fields -->
    <text x="345" y="172" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">PK  enrollment_id</text>
    <text x="475" y="172" fill="#94a3b8" font-family="monospace" font-size="10">INT(11)</text>
    <line x1="340" y1="180" x2="540" y2="180" stroke="#334155" stroke-width="1"/>

    <text x="345" y="198" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">FK  student_id</text>
    <text x="475" y="198" fill="#94a3b8" font-family="monospace" font-size="10">INT(11)</text>

    <text x="345" y="220" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">FK  course_id</text>
    <text x="475" y="220" fill="#94a3b8" font-family="monospace" font-size="10">INT(11)</text>

    <text x="345" y="242" fill="#f8fafc" font-family="monospace" font-size="11">    grade_point</text>
    <text x="475" y="242" fill="#94a3b8" font-family="monospace" font-size="10">DECIMAL(3,2)</text>
  </g>

  <!-- Table 3: courses -->
  <g filter="url(#dbShadow)">
    <rect x="580" y="70" width="180" height="155" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <path d="M 580 78 Q 580 70 588 70 L 752 70 Q 760 70 760 78 L 760 102 L 580 102 Z" fill="#047857"/>
    <text x="595" y="92" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">tbl_courses</text>

    <!-- Fields -->
    <text x="595" y="122" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">PK  course_id</text>
    <text x="705" y="122" fill="#94a3b8" font-family="monospace" font-size="10">INT</text>
    <line x1="590" y1="130" x2="750" y2="130" stroke="#334155" stroke-width="1"/>

    <text x="595" y="148" fill="#f8fafc" font-family="monospace" font-size="11">    course_name</text>
    <text x="705" y="148" fill="#94a3b8" font-family="monospace" font-size="10">VARCHAR</text>

    <text x="595" y="170" fill="#f8fafc" font-family="monospace" font-size="11">    credits</text>
    <text x="705" y="170" fill="#94a3b8" font-family="monospace" font-size="10">INT</text>

    <text x="595" y="192" fill="#f8fafc" font-family="monospace" font-size="11">    department</text>
    <text x="705" y="192" fill="#94a3b8" font-family="monospace" font-size="10">VARCHAR</text>
  </g>

  <!-- Relationship Connector Lines -->
  <!-- Student to Enrollment -->
  <path d="M 270 122 L 300 122 Q 315 122 315 150 L 315 198 L 330 198" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="270" cy="122" r="3" fill="#38bdf8"/>
  <polygon points="330,198 322,194 322,202" fill="#38bdf8"/>

  <!-- Course to Enrollment -->
  <path d="M 580 122 L 565 122 Q 555 122 555 150 L 555 220 L 550 220" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="580" cy="122" r="3" fill="#34d399"/>
  <polygon points="550,220 558,216 558,224" fill="#34d399"/>

  <!-- SQL Query Terminal Panel (Bottom) -->
  <g filter="url(#dbShadow)">
    <rect x="50" y="270" width="710" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 50 278 Q 50 270 58 270 L 752 270 Q 760 270 760 278 L 760 298 L 50 298 Z" fill="#1e293b"/>
    <circle cx="70" cy="284" r="4" fill="#ef4444"/>
    <circle cx="85" cy="284" r="4" fill="#f59e0b"/>
    <circle cx="100" cy="284" r="4" fill="#10b981"/>
    <text x="120" y="288" fill="#94a3b8" font-family="monospace" font-size="10">query-editor.sql — MySQL 8.0</text>

    <!-- Syntax Highlighted Query -->
    <text x="70" y="325" font-family="monospace" font-size="12">
      <tspan fill="#f43f5e" font-weight="bold">SELECT</tspan>
      <tspan fill="#f8fafc"> s.student_id, s.first_name, c.course_name, e.grade_point</tspan>
    </text>
    <text x="70" y="348" font-family="monospace" font-size="12">
      <tspan fill="#f43f5e" font-weight="bold">FROM</tspan>
      <tspan fill="#f8fafc"> tbl_students s</tspan>
      <tspan fill="#38bdf8" font-weight="bold"> INNER JOIN</tspan>
      <tspan fill="#f8fafc"> tbl_enrollments e </tspan>
      <tspan fill="#38bdf8" font-weight="bold">ON</tspan>
      <tspan fill="#f8fafc"> s.student_id = e.student_id</tspan>
    </text>
    <text x="70" y="371" font-family="monospace" font-size="12">
      <tspan fill="#38bdf8" font-weight="bold">INNER JOIN</tspan>
      <tspan fill="#f8fafc"> tbl_courses c </tspan>
      <tspan fill="#38bdf8" font-weight="bold">ON</tspan>
      <tspan fill="#f8fafc"> e.course_id = c.course_id</tspan>
      <tspan fill="#f43f5e" font-weight="bold"> WHERE</tspan>
      <tspan fill="#f8fafc"> e.grade_point &gt;= </tspan><tspan fill="#f59e0b">3.50</tspan><tspan fill="#f8fafc">;</tspan>
    </text>
    <text x="70" y="398" fill="#10b981" font-family="monospace" font-size="11">
      -- 14 rows returned (0.002 sec). Relational query executed successfully.
    </text>
  </g>
</svg>
